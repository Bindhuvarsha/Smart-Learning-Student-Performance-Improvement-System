<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Test – Smart School</title>
    <!-- Google Fonts & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Sidebar (Practice Tests active) -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon"><i class="bi bi-book-half"></i></div>
                <div class="sidebar-brand-title">Smart School</div>
                <div class="sidebar-brand-subtitle">Learn &bull; Grow &bull; Succeed</div>
            </div>

            <nav class="sidebar-nav">
                <a href="student.html" class="sidebar-nav-item">
                    <i class="bi bi-grid-fill"></i>
                    <span>Dashboard</span>
                </a>
                <a href="materials.html" class="sidebar-nav-item">
                    <i class="bi bi-journal-bookmark"></i>
                    <span>My Learning</span>
                </a>
                <a href="quiz.html" class="sidebar-nav-item active">
                    <i class="bi bi-check2-square"></i>
                    <span>Practice Tests</span>
                </a>
                <a href="performance.html" class="sidebar-nav-item">
                    <i class="bi bi-graph-up"></i>
                    <span>Performance</span>
                </a>
                <a href="resources.html" class="sidebar-nav-item">
                    <i class="bi bi-folder2-open"></i>
                    <span>Resources</span>
                </a>
                <a href="student.html" class="sidebar-nav-item">
                    <i class="bi bi-person"></i>
                    <span>Profile</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="sidebar-nav-item">
                    <i class="bi bi-box-arrow-left"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="app-content">
            <!-- Topbar (Screen 4) -->
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="btn-sidebar-toggle" id="btnToggleSidebar"><i class="bi bi-list"></i></button>
                </div>
                <div class="topbar-right">
                    <div class="notification-bell">
                        <i class="bi bi-bell"></i>
                        <span class="notification-dot"></span>
                    </div>
                    <div class="user-profile-pill">
                        <div class="user-avatar-img"><i class="bi bi-person-fill"></i></div>
                        <div class="user-info-text">
                            <div class="user-info-name">Bindhu Shree</div>
                            <div class="user-info-role">Student <i class="bi bi-chevron-down ms-1" style="font-size: 0.65rem;"></i></div>
                        </div>
                    </div>
                </div>
            </header>

            <main class="page-body" style="display: flex; flex-direction: column; align-items: center;">
                
                <div style="width: 100%; max-width: 780px;">
                    
                    <!-- Subject Switcher Pills Bar -->
                    <div class="quiz-subject-pills-bar mb-3" id="quizSubjectPillsBar">
                        <button class="quiz-subject-pill active" id="pill-math" onclick="switchSubject('math')">
                            <i class="bi bi-calculator"></i> Mathematics
                        </button>
                        <button class="quiz-subject-pill" id="pill-science" onclick="switchSubject('science')">
                            <i class="bi bi-radioactive"></i> Science
                        </button>
                        <button class="quiz-subject-pill" id="pill-english" onclick="switchSubject('english')">
                            <i class="bi bi-book"></i> English
                        </button>
                        <button class="quiz-subject-pill" id="pill-social" onclick="switchSubject('social')">
                            <i class="bi bi-globe2"></i> Social Science
                        </button>
                        <button class="quiz-subject-pill" id="pill-kannada" onclick="switchSubject('kannada')">
                            <i class="bi bi-translate"></i> Kannada
                        </button>
                    </div>

                    <!-- Practice Test Card (Screen 4) -->
                    <div class="practice-test-card">
                        
                        <!-- Test Top Bar with Title and Timer -->
                        <div class="test-top-bar">
                            <a href="student.html" class="test-back-btn">
                                <i class="bi bi-arrow-left"></i>
                                <span id="quizSubjectTitle">Mathematics Practice Test</span>
                            </a>
                            <div class="test-timer-badge">
                                <i class="bi bi-stopwatch"></i>
                                <span id="quizTimerDisplay">00:25:00</span>
                            </div>
                        </div>

                        <!-- Progress indicator with proper spacing -->
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.65rem; font-size: 0.82rem; color: #64748b; font-weight: 600;">
                            <span id="quizQuestionCounter">Question 1 of 5</span>
                            <span id="quizScorePreview" style="color: #1e6bff;">Progress: 20%</span>
                        </div>
                        <div class="quiz-progress-bar-container">
                            <div class="quiz-progress-fill" id="quizProgressBar" style="width: 20%;"></div>
                        </div>

                        <!-- Question Title -->
                        <div class="question-text" id="questionText">
                            1. Which of the following is a prime number?
                        </div>

                        <!-- Options Container -->
                        <div class="options-group mb-4" id="optionsContainer">
                            <!-- Injected dynamically -->
                        </div>

                        <!-- Bottom Navigation Buttons (Screen 4) -->
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem;">
                            <button id="btnPrevQuestion" class="btn-smart-outline" onclick="prevQuestion()" disabled>
                                &larr; Previous
                            </button>
                            <button id="btnNextQuestion" class="btn-smart-primary" style="padding: 0.55rem 1.75rem;" onclick="nextQuestion()">
                                Next &rarr;
                            </button>
                        </div>

                    </div>

                </div>

            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('btnToggleSidebar')?.addEventListener('click', () => {
            document.getElementById('appSidebar').classList.toggle('show');
        });

        // Comprehensive Curriculum Question Bank per Subject
        const subjectQuestionBank = {
            math: {
                title: "Mathematics Practice Test",
                badge: "Mathematics",
                questions: [
                    {
                        q: "1. Which of the following is a prime number?",
                        options: ["4", "7", "9", "12"],
                        correct: 1,
                        explanation: "7 is a prime number because it is only divisible by 1 and itself."
                    },
                    {
                        q: "2. Solve for x: 3x - 7 = 14",
                        options: ["5", "6", "7", "8"],
                        correct: 2,
                        explanation: "3x = 14 + 7 = 21, hence x = 21 / 3 = 7."
                    },
                    {
                        q: "3. What is the sum of interior angles in a triangle?",
                        options: ["90°", "180°", "270°", "360°"],
                        correct: 1,
                        explanation: "The interior angles of any planar triangle always sum to 180°."
                    },
                    {
                        q: "4. The value of sin(90°) is:",
                        options: ["0", "1/2", "1", "Undefined"],
                        correct: 2,
                        explanation: "In trigonometry, the value of sin(90°) is 1."
                    },
                    {
                        q: "5. If the radius of a circle is 7 cm, its circumference is: (π ≈ 22/7)",
                        options: ["22 cm", "44 cm", "88 cm", "154 cm"],
                        correct: 1,
                        explanation: "Circumference = 2 * π * r = 2 * (22/7) * 7 = 44 cm."
                    }
                ]
            },
            science: {
                title: "Science Practice Test",
                badge: "Science",
                questions: [
                    {
                        q: "1. What is the chemical formula of water?",
                        options: ["H2O2", "H2O", "CO2", "HO2"],
                        correct: 1,
                        explanation: "Water consists of two hydrogen atoms bonded to one oxygen atom (H2O)."
                    },
                    {
                        q: "2. Which organelle is known as the 'powerhouse of the cell'?",
                        options: ["Ribosome", "Mitochondria", "Nucleus", "Chloroplast"],
                        correct: 1,
                        explanation: "Mitochondria produce cellular ATP through respiration, earning them this title."
                    },
                    {
                        q: "3. What is Newton's First Law of Motion also commonly referred to as?",
                        options: ["Law of Acceleration", "Law of Inertia", "Law of Gravity", "Law of Momentum"],
                        correct: 1,
                        explanation: "Newton's First Law states an object remains in its state of rest or uniform motion unless acted upon by an external force (Law of Inertia)."
                    },
                    {
                        q: "4. What is the pH value of pure, neutral water at 25°C?",
                        options: ["5", "7", "9", "14"],
                        correct: 1,
                        explanation: "Pure neutral water has a pH of 7 on the standard 0 to 14 scale."
                    },
                    {
                        q: "5. Which type of lens is used to correct myopia (nearsightedness)?",
                        options: ["Convex lens", "Concave lens", "Bifocal lens", "Cylindrical lens"],
                        correct: 1,
                        explanation: "A concave (diverging) lens is used to correct myopia by focusing distant images onto the retina."
                    }
                ]
            },
            english: {
                title: "English Practice Test",
                badge: "English",
                questions: [
                    {
                        q: "1. Identify the adjective in the sentence: 'The diligent student completed the examination.'",
                        options: ["student", "completed", "diligent", "examination"],
                        correct: 2,
                        explanation: "'Diligent' modifies the noun 'student', functioning as an adjective."
                    },
                    {
                        q: "2. Choose the correct passive voice: 'The author wrote an inspiring story.'",
                        options: [
                            "An inspiring story is written by the author.",
                            "An inspiring story was written by the author.",
                            "An inspiring story has been written by the author.",
                            "An inspiring story had written by the author."
                        ],
                        correct: 1,
                        explanation: "The past simple 'wrote' converts to 'was written' in passive voice."
                    },
                    {
                        q: "3. What is the synonym of the word 'Abundant'?",
                        options: ["Scarce", "Plentiful", "Rare", "Deficient"],
                        correct: 1,
                        explanation: "'Abundant' means plentiful or available in great quantity."
                    },
                    {
                        q: "4. Fill in the blank: 'Neither the teacher nor the students ______ present in the auditorium.'",
                        options: ["was", "were", "is", "has"],
                        correct: 1,
                        explanation: "With 'neither... nor', the verb agrees with the closer plural noun ('students' -> 'were')."
                    },
                    {
                        q: "5. Identify the figure of speech: 'The ancient trees whispered in the gentle breeze.'",
                        options: ["Simile", "Metaphor", "Personification", "Hyperbole"],
                        correct: 2,
                        explanation: "Attributing the human action of whispering to trees is Personification."
                    }
                ]
            },
            social: {
                title: "Social Science Practice Test",
                badge: "Social Science",
                questions: [
                    {
                        q: "1. In which year did the historic Jallianwala Bagh massacre take place?",
                        options: ["1915", "1919", "1921", "1930"],
                        correct: 1,
                        explanation: "The Jallianwala Bagh massacre occurred on 13 April 1919 in Amritsar."
                    },
                    {
                        q: "2. Which Articles of the Indian Constitution guarantee the Right to Equality?",
                        options: ["Articles 14 to 18", "Articles 19 to 22", "Articles 23 to 24", "Articles 25 to 28"],
                        correct: 0,
                        explanation: "Articles 14 to 18 of the Indian Constitution guarantee Fundamental Right to Equality."
                    },
                    {
                        q: "3. Which river is commonly referred to as the 'Sorrow of Bihar' due to frequent flooding?",
                        options: ["Ganga", "Yamuna", "Kosi", "Brahmaputra"],
                        correct: 2,
                        explanation: "The Kosi River is known as the Sorrow of Bihar because of devastating recurring floods."
                    },
                    {
                        q: "4. Who was the founder of the Maurya Empire?",
                        options: ["Emperor Ashoka", "Chandragupta Maurya", "Bindusara", "Samudragupta"],
                        correct: 1,
                        explanation: "Chandragupta Maurya founded the Maurya Empire in 322 BCE."
                    },
                    {
                        q: "5. What type of economic system does India follow?",
                        options: ["Pure Capitalist Economy", "Pure Socialist Economy", "Mixed Economy", "Traditional Economy"],
                        correct: 2,
                        explanation: "India has a Mixed Economy featuring both private sector enterprise and public state-owned operations."
                    }
                ]
            },
            kannada: {
                title: "Kannada (ಕನ್ನಡ) Practice Test",
                badge: "Kannada",
                questions: [
                    {
                        q: "1. ಕನ್ನಡ ವರ್ಣಮಾಲೆಯಲ್ಲಿ ಒಟ್ಟು ಎಷ್ಟು ಅಕ್ಷರಗಳಿವೆ?",
                        options: ["೪೮", "೪೯", "೫೦", "೫೨"],
                        correct: 1,
                        explanation: "ಕನ್ನಡ ವರ್ಣಮಾಲೆಯಲ್ಲಿ ಒಟ್ಟು ೪೯ (49) ಅಕ್ಷರಗಳಿವೆ (ಸ್ವರಗಳು: ೧೪, ಯೋಗವಾಹಗಳು: ೨, ವ್ಯಂಜನಗಳು: ೩೩)."
                    },
                    {
                        q: "2. 'ವಿದ್ಯಾಲಯ' (ವಿದ್ಯಾ + ಆಲಯ) ಈ ಪದವು ಯಾವ ಸಂಧಿಗೆ ಉದಾಹರಣೆಯಾಗಿದೆ?",
                        options: ["ಗುಣಸಂಧಿ", "ಸವರ್ಣದೀರ್ಘ ಸಂಧಿ", "ವೃದ್ಧಿಸಂಧಿ", "ಆಗಮಸಂಧಿ"],
                        correct: 1,
                        explanation: "ಸವರ್ಣ ಸ್ವರಗಳು ಪರವಾದಾಗ ಅದೇ ಜಾತಿಯ ದೀರ್ಘ ಸ್ವರ ಬರುವುದರಿಂದ ಇದು ಸವರ್ಣದೀರ್ಘ ಸಂಧಿಯಾಗಿದೆ."
                    },
                    {
                        q: "3. ಕರ್ನಾಟಕ ರಾಜ್ಯೋತ್ಸವ ದಿನವನ್ನು ಪ್ರತಿ ವರ್ಷ ಯಾವಾಗ ಆಚರಿಸಲಾಗುತ್ತದೆ?",
                        options: ["ನವೆಂಬರ್ ೧", "ಆಗಸ್ಟ್ ೧೫", "ಜನವರಿ ೨೬", "ಅಕ್ಟೋಬರ್ ೨"],
                        correct: 0,
                        explanation: "೧೯೫೬ ರ ನವೆಂಬರ್ ೧ ರಂದು ಮೈಸೂರು ರಾಜ್ಯ ಉದಯವಾಯಿತು, ಆದ್ದರಿಂದ ನವೆಂಬರ್ ೧ ರಂದು ಕನ್ನಡ ರಾಜ್ಯೋತ್ಸವ ಆಚರಿಸಲಾಗುತ್ತದೆ."
                    },
                    {
                        q: "4. ಕನ್ನಡದ ಮೊಟ್ಟಮೊದಲ ಉಪಲಬ್ಧ ಸಾಹಿತ್ಯ ಕೃತಿ 'ಕವಿರಾಜಮಾರ್ಗ'ದ ಕರ್ತೃ ಯಾರು?",
                        options: ["ಆದಿಕವಿ ಪಂಪ", "ಶ್ರೀವಿಜಯ / ನೃಪತುಂಗ", "ರನ್ನ", "ಕುಮಾರವ್ಯಾಸ"],
                        correct: 1,
                        explanation: "'ಕವಿರಾಜಮಾರ್ಗ' ಕೃತಿಯು ರಾಷ್ಟ್ರಕೂಟ ದೊರೆ ನೃಪತುಂಗನ ಆಸ್ಥಾನದ ಶ್ರೀವಿಜಯನಿಂದ ರಚಿಸಲ್ಪಟ್ಟಿದೆ."
                    },
                    {
                        q: "5. 'ಕಣ್ಣು' ಪದದ ಸಂಸ್ಕೃತ ತತ್ಸಮ ರೂಪ ಯಾವುದು?",
                        options: ["ಅಕ್ಷಿ", "ಕಣ್ಣೋಟ", "ಕಾಣು", "ಕಂಜ"],
                        correct: 0,
                        explanation: "'ಅಕ್ಷಿ' ಎಂಬುದು ಸಂಸ್ಕೃತ ತತ್ಸಮವಾಗಿದ್ದು, 'ಕಣ್ಣು' ಎಂಬುದು ಅದರ ಕನ್ನಡ ತದ್ಭವ ರೂಪವಾಗಿದೆ."
                    }
                ]
            }
        };

        // Determine current subject from URL parameters or default to math
        const urlParams = new URLSearchParams(window.location.search);
        let currentSubjectKey = urlParams.get('subject') || 'math';
        if (!subjectQuestionBank[currentSubjectKey]) currentSubjectKey = 'math';

        let questions = subjectQuestionBank[currentSubjectKey].questions;
        let currentIndex = 0;
        let userAnswers = {};
        if (currentSubjectKey === 'math') {
            userAnswers[0] = 1; // Default option 7 selected for math per Screen 4 mockup
        }

        function switchSubject(key) {
            if (!subjectQuestionBank[key]) return;
            currentSubjectKey = key;
            questions = subjectQuestionBank[key].questions;
            currentIndex = 0;
            userAnswers = {};
            if (currentSubjectKey === 'math') {
                userAnswers[0] = 1;
            }

            // Update pills active state
            document.querySelectorAll('.quiz-subject-pill').forEach(pill => pill.classList.remove('active'));
            const activePill = document.getElementById(`pill-${key}`);
            if (activePill) activePill.classList.add('active');

            // Update title
            document.getElementById('quizSubjectTitle').textContent = subjectQuestionBank[key].title;

            // Render first question
            renderQuestion(0);
            SmartToast.show(`Switched to ${subjectQuestionBank[key].badge} Practice Test!`, 'info');
        }

        function renderQuestion(index) {
            const q = questions[index];
            document.getElementById('questionText').textContent = q.q;
            document.getElementById('quizQuestionCounter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            const pct = Math.round(((index + 1) / questions.length) * 100);
            document.getElementById('quizProgressBar').style.width = `${pct}%`;
            document.getElementById('quizScorePreview').textContent = `Progress: ${pct}%`;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((opt, i) => {
                const isSelected = userAnswers[index] === i;
                const div = document.createElement('div');
                div.className = `custom-radio-option ${isSelected ? 'selected' : ''}`;
                div.onclick = () => handleOptionClick(i);
                div.innerHTML = `
                    <div class="custom-radio-circle"></div>
                    <span>${opt}</span>
                `;
                container.appendChild(div);
            });

            document.getElementById('btnPrevQuestion').disabled = index === 0;

            const nextBtn = document.getElementById('btnNextQuestion');
            if (index === questions.length - 1) {
                nextBtn.innerHTML = 'Submit Test <i class="bi bi-check2-circle ms-1"></i>';
                nextBtn.className = 'btn-smart-primary';
                nextBtn.style.background = '#10b981';
                nextBtn.style.borderColor = '#10b981';
            } else {
                nextBtn.innerHTML = 'Next &rarr;';
                nextBtn.className = 'btn-smart-primary';
                nextBtn.style.background = '';
                nextBtn.style.borderColor = '';
            }
        }

        function handleOptionClick(optionIndex) {
            userAnswers[currentIndex] = optionIndex;
            renderQuestion(currentIndex);
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else {
                submitQuiz();
            }
        }

        function submitQuiz() {
            let score = 0;
            const detailedResults = questions.map((q, idx) => {
                const selected = userAnswers[idx];
                const isCorrect = selected === q.correct;
                if (isCorrect) score++;
                return {
                    question: q.q,
                    options: q.options,
                    selected: selected,
                    correct: q.correct,
                    isCorrect: isCorrect,
                    explanation: q.explanation
                };
            });

            const resultData = {
                title: subjectQuestionBank[currentSubjectKey].title,
                subject: subjectQuestionBank[currentSubjectKey].badge,
                score: score,
                total: questions.length,
                percentage: Math.round((score / questions.length) * 100),
                timeSpent: "3m 45s",
                detailedResults: detailedResults
            };

            localStorage.setItem('latest_quiz_result', JSON.stringify(resultData));
            SmartToast.show('Test submitted successfully! Redirecting to results...', 'success');
            setTimeout(() => {
                window.location.href = 'quiz-result.html';
            }, 600);
        }

        // Initialize active subject
        switchSubject(currentSubjectKey);

        // Live Countdown Timer (Screen 4: 00:25:00)
        let totalSeconds = 25 * 60;
        const timerElem = document.getElementById('quizTimerDisplay');
        setInterval(() => {
            if (totalSeconds > 0) {
                totalSeconds--;
                const hrs = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;
                timerElem.textContent = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }, 1000);

        // Initial render
        renderQuestion(0);
    </script>
</body>
</html>
